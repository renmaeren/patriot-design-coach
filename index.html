<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Patriot Field Guide — Design Coach</title><style>body{font:18px Georgia,serif;background:#f6f0e3;color:#172b43;margin:10vh auto;max-width:720px;padding:24px}a{color:#792f3b}</style></head><body><h1>Opening The Patriot Design Coach…</h1><p id="status">Loading the official template gallery and current corrections.</p><script>
(async()=>{
 try{
   const response=await fetch('./coach-core.html?v=20261023b',{cache:'no-store'});
   if(!response.ok)throw Error('Core app unavailable: '+response.status);
   let html=await response.text();
   const start='<script id="embeddedData" type="application/json">';
   const a=html.indexOf(start);
   const b=a<0?-1:html.indexOf('</scr'+'ipt>',a+start.length);
   if(a<0||b<0)throw Error('Template data could not be located');
   const original=html.slice(a+start.length,b);
   const data=JSON.parse(original);
   const names={"Seniors":["Identification Plate","Observed in the Field","Field Collection","The Senior Spotlight","The Class Story"],"Fine Arts":["Program Profile","In Rehearsal / In the Studio","Performance / Final Product","Fine Arts Showcase","Behind the Scenes"],"Appendices":["Index / Catalog","Glossary","Chronology","Patriot Collection","Data & Records"]};
   for(const [key,labels] of Object.entries(names)){
      if(!Array.isArray(data.images[key])||data.images[key].length!==5)throw Error('Missing five guide images for '+key);
      data.names[key]=labels;
   }
   const json=JSON.stringify(data).replace(/</g,'\\u003c');
   html=html.slice(0,a+start.length)+json+html.slice(b);
   html=html.replace('</body>','<a href="./ai-review.html" style="position:fixed;right:16px;bottom:16px;z-index:9999;background:#792f3b;color:#fff;padding:14px 18px;border-radius:5px;font:700 15px Arial,sans-serif;text-decoration:none;box-shadow:0 3px 18px #172b4355">AI Spread Review ↗</a></body>');
   html=html.replace('</body>','<a href="./inspection.html" style="position:fixed;left:16px;bottom:16px;z-index:9999;background:#172c43;color:white;padding:14px 18px;border-radius:5px;font:700 15px Arial,sans-serif;text-decoration:none;box-shadow:0 3px 18px #172c4355">Spread Inspection Studio ↗</a></body>');
   document.open();document.write(html);document.close();
 }catch(err){document.getElementById('status').textContent='Unable to open updated Coach: '+err.message;}
})();
</script></body></html>
